name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: static and logic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: assertion baseline
        run: |
          set -euo pipefail
          node tests/qa.mjs | tee qa.log
          COUNT=$(grep -oE '[0-9]+ assertion' qa.log | grep -oE '[0-9]+')
          echo "assertions passed: $COUNT"
          if [ "$COUNT" -lt 155 ]; then
            echo "::error::assertion count fell below the 155 baseline ($COUNT). A test may have been deleted."
            exit 1
          fi

      - name: single file contract
        run: |
          set -euo pipefail
          test -f index.html
          SIZE=$(wc -c < index.html)
          echo "index.html: $SIZE bytes"
          [ "$SIZE" -lt 122880 ] || { echo "::error::index.html passed the 120 KB limit"; exit 1; }
          ! grep -qE '<(img|link[^>]+stylesheet)' index.html || { echo "::error::external asset reference"; exit 1; }
          ! grep -q 'http://' index.html || { echo "::error::insecure http source"; exit 1; }
          grep -q 'three@0.169.0' index.html || { echo "::error::the three.js version is not pinned"; exit 1; }
          ! ls *.png *.jpg *.glb *.mp3 2>/dev/null | grep . || { echo "::error::a binary asset is in the repository"; exit 1; }
          ! test -e .assembly || { echo "::error::the abandoned .assembly leftover is back"; exit 1; }
          ! test -e .github/workflows/assemble.yml || { echo "::error::the abandoned assemble.yml is back"; exit 1; }

      - name: README figures agree with reality
        run: |
          set -euo pipefail
          SIZE=$(wc -c < index.html)
          RAW=$(grep -oE 'single%20file-[^)]*%20bytes' README.md | head -1)
          [ -n "$RAW" ] || { echo "::error::the single file size badge is missing or was renamed"; exit 1; }
          # strip the badge label, the unit, an encoded comma and any plain separator,
          # so 27%2C873, 27.873 and 27873 all reduce to the same digits
          R_SIZE=$(printf '%s' "$RAW" | sed -E 's/^single%20file-//; s/%20bytes$//; s/%2C//g; s/[.,]//g')
          echo "real size: $SIZE, README claim: $R_SIZE"
          [ "$SIZE" = "$R_SIZE" ] || { echo "::error::the README claims $R_SIZE bytes, the real size is $SIZE"; exit 1; }
          COUNT=$(node tests/qa.mjs | grep -oE '[0-9]+ assertion' | grep -oE '[0-9]+')
          R_COUNT=$(grep -oE 'static%20assertions-[0-9]+' README.md | sed -E 's/.*-//')
          [ -n "$R_COUNT" ] || { echo "::error::the static assertion badge is missing or was renamed"; exit 1; }
          echo "real assertions: $COUNT, README claim: $R_COUNT"
          [ "$COUNT" = "$R_COUNT" ] || { echo "::error::the README claims $R_COUNT assertions, the real count is $COUNT"; exit 1; }

      - name: the live link claim is verified
        run: |
          set -euo pipefail
          if grep -q 'umutseve4.github.io/yildiz-inisi-webgl' README.md; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L https://umutseve4.github.io/yildiz-inisi-webgl/)
            echo "Pages HTTP code: $CODE"
            [ "$CODE" = "200" ] || { echo "::error::the README gives a live link but the URL returns $CODE"; exit 1; }
          else
            echo "the README claims no live link, check skipped"
          fi

  browser:
    name: chromium acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: playwright
        run: |
          set -uo pipefail
          set +e
          npx playwright test --reporter=list > pw.log 2>&1
          RC=$?
          set -e
          tail -n 150 pw.log
          if [ "$RC" -ne 0 ]; then
            grep -nE 'Error|error|expect|Timeout|failed|passed|[0-9]+\)' pw.log | head -30 > diag.txt || true
            while IFS= read -r line; do echo "::error::$line"; done < diag.txt
            echo "::error::playwright exit code $RC"
            exit 1
          fi
          PASSED=$(grep -oE '[0-9]+ passed' pw.log | tail -1 | grep -oE '[0-9]+')
          echo "tests passed: $PASSED"
          if [ "$PASSED" -lt 29 ]; then
            echo "::error::acceptance test count fell below the 29 baseline ($PASSED)."
            exit 1
          fi
          R_TESTS=$(grep -oE 'Chromium%20acceptance-[0-9]+' README.md | sed -E 's/.*-//')
          [ -n "$R_TESTS" ] || { echo "::error::the Chromium acceptance badge is missing or was renamed"; exit 1; }
          echo "README test claim: $R_TESTS"
          [ "$PASSED" = "$R_TESTS" ] || { echo "::error::the README claims $R_TESTS tests, $PASSED actually passed"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: |
            test-results
            pw.log
          retention-days: 5
